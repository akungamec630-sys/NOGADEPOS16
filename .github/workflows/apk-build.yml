name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Patch Android (minSdk + modul scanner)
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' android/variables.gradle
          sed -i 's#</application>#<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/></application>#' android/app/src/main/AndroidManifest.xml
          grep -n "barcode_ui" android/app/src/main/AndroidManifest.xml
      - name: Pasang plugin native WhatsApp
        run: cp native/*.java android/app/src/main/java/id/toko/pos/
      - run: npx cap sync android
      - name: Pakai kunci debug tetap (jika secret KEYSTORE_BASE64 ada)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Memakai kunci debug tetap"
          else
            echo "Secret KEYSTORE_BASE64 belum diisi, memakai kunci debug acak (seperti sebelumnya)"
          fi
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: POS-Toko-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
